# CI for mytripadvision. GitHub only runs workflows from the repository root: when this service lives in its
# own repository this file works as is; inside the combined repository copy it to the root and set
# `working-directory: mytripadvision` on the steps.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # unit + slice tests, Testcontainers integration tests (pgvector image; Docker is available on ubuntu
      # runners), Enforcer, JaCoCo gate. No real call to an external API is made.
      - name: Verify
        run: ./mvnw -B clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
